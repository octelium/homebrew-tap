name: Update Homebrew Formula

on:
  schedule:
    # Every 30 minutes, offset from the busiest start of the hour.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Tag (e.g. v1.2.3)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-octelium-formula-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Read the current branch tip after any earlier updater has finished.
          ref: ${{ github.ref_name }}

      - name: Resolve Version
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$REQUESTED_VERSION" ]; then
            echo "No version provided. Fetching latest Octelium release from GitHub..."
            TAG=$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/octelium/octelium/releases/latest \
              | jq -er '.tag_name')
          else
            TAG="$REQUESTED_VERSION"
          fi

          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Failed to resolve a valid release tag."
            exit 1
          fi

          CLEAN_VERSION=${TAG#v}

          echo "Target tag: $TAG"
          echo "Clean version: $CLEAN_VERSION"

          if [ -z "$REQUESTED_VERSION" ]; then
            CURRENT_VERSION=$(sed -nE 's/^[[:space:]]*version "([^"]+)"[[:space:]]*$/\1/p' Formula/octelium.rb)
            if [ -z "$CURRENT_VERSION" ]; then
              echo "Error: Could not read the current formula version."
              exit 1
            fi

            if [ "$CLEAN_VERSION" = "$CURRENT_VERSION" ]; then
              echo "Formula is already at $TAG. Skipping update."
              echo "update_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"
          echo "update_needed=true" >> "$GITHUB_OUTPUT"

      - name: Download Checksums
        if: steps.resolve.outputs.update_needed == 'true'
        run: |
          CHECKSUM_URL="https://github.com/octelium/octelium/releases/download/${TAG}/SHA256SUMS"
          echo "Downloading checksums from $CHECKSUM_URL"
          curl -fsSL "$CHECKSUM_URL" -o SHA256SUMS
          
          if [ ! -s SHA256SUMS ]; then
            echo "Error: Checksums file is empty or missing!"
            exit 1
          fi

      - name: Generate Formula from Template
        if: steps.resolve.outputs.update_needed == 'true'
        run: |
          for BIN in octelium octeliumctl octops; do
            for OS in darwin linux; do
              for ARCH in amd64 arm64; do
                
                VAR_NAME="SHA_${BIN}_${OS}_${ARCH}"
                VAR_NAME=$(echo "$VAR_NAME" | tr '[:lower:]' '[:upper:]')
                
                FILE_NAME="${BIN}-${OS}-${ARCH}.tar.gz"
                
                SHA=$(grep -E "(^|[[:space:]])${FILE_NAME}($|[[:space:]])" SHA256SUMS | awk '{print $1}')
                
                if [ -z "$SHA" ]; then
                  echo "Error: Could not find checksum for $FILE_NAME in SHA256SUMS"
                  exit 1
                fi
                
                export $VAR_NAME="$SHA"
                echo "Found $VAR_NAME = $SHA"
                
              done
            done
          done

          envsubst < Formula/octelium.rb.tmpl > Formula/octelium.rb
          
          echo "Successfully generated Formula/octelium.rb"

      - name: Commit and Push
        if: steps.resolve.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Formula/octelium.rb
          
          if git diff --staged --quiet; then
            echo "Formula is already up to date. Nothing to commit."
          else
            git commit -m "Update octelium to ${TAG}"
            git push
            echo "Pushed update to tap repository."
          fi
